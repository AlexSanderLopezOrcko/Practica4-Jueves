<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick and Morty API</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="contenedor">
      <h1>Buscar personaje</h1>

      <div class="buscador">
        <input
          type="text"
          id="pokemon"
          placeholder="Introduzca el nombre del personaje"
        />
        <button id="btnBuscar">Filtrar</button>
      </div>

      <section class="pokemon">
        <img
          id="imagen"
          src="https://placehold.co/180x180?text=Personaje"
          alt="Personaje"
        />

        <h2 id="nombre"></h2>

        <div class="datos">
          <h3>Estado</h3>
          <p id="tipo"></p>

          <h3>Especie</h3>
          <p id="altura"></p>

          <h3>Género</h3>
          <p id="peso"></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
